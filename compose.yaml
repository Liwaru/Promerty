x-runtime: &runtime
  image: promerty-app:${PROMERTY_RELEASE:?set PROMERTY_RELEASE}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mariadb
    DB_QUEUE_RETRY_AFTER: "150"
    VIEW_COMPILED_PATH: /tmp/promerty-views
  volumes:
    - type: bind
      source: ${PROMERTY_RUNTIME_ENV:?set path to protected Laravel runtime file}
      target: /app/.env
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PROMERTY_DB_CA_FILE:?set path to the approved database CA file}
      target: /run/promerty-db-ca.pem
      read_only: true
      bind:
        create_host_path: false
    - storage:/app/storage
    - public_media:/app/storage/app/public
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  app:
    <<: *runtime
    build:
      context: .
      target: app
    networks: [web, runtime]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 15s
  worker:
    <<: *runtime
    command: ["php", "artisan", "queue:work", "database", "--queue=default,media", "--sleep=2", "--tries=1", "--timeout=120"]
    networks: [runtime]
    stop_signal: SIGTERM
    stop_grace_period: 140s
    depends_on:
      app:
        condition: service_healthy
  web:
    image: promerty-web:${PROMERTY_RELEASE:?set PROMERTY_RELEASE}
    build:
      context: .
      target: web
    environment:
      PROMERTY_SERVER_NAME: ${PROMERTY_SERVER_NAME:?set the domain or QA loopback host}
      PROMERTY_TRUSTED_PROXY: ${PROMERTY_TRUSTED_PROXY:?set the trusted edge address}
      PROMERTY_FCGI_HTTPS: "on"
      NGINX_ENVSUBST_FILTER: "^PROMERTY_"
    ports:
      - "127.0.0.1:${PROMERTY_HTTP_PORT:-8080}:8080"
    volumes:
      - public_media:/srv/promerty-public:ro
    networks: [web]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Host: $$PROMERTY_SERVER_NAME\" http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
  runtime:

volumes:
  storage:
    external: true
    name: ${PROMERTY_STORAGE_VOLUME:?set private storage volume name}
  public_media:
    external: true
    name: ${PROMERTY_PUBLIC_VOLUME:?set public media volume name}
